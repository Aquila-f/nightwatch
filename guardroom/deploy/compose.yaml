services:
  guardroom:
    build:
      context: ../..
      dockerfile: guardroom/deploy/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-9999}:9999"
    environment:
      GUARDROOM_CONFIG: /app/guardroom/configs/shop.json
      INVESTIGATOR_URL: http://investigator:9998
    volumes:
      - type: bind
        source: ${GUARDROOM_CONFIG:-../configs/shop.json}
        target: /app/guardroom/configs/shop.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITOR_LOG_DIR:-../../.run/monitor}
        target: /app/.run/monitor
        read_only: true
        bind:
          create_host_path: false
      - guardroom-state:/app/guardroom/.run
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  investigator:
    build:
      context: ../..
      dockerfile: investigator/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NIGHTWATCH_GRAPH_URL: http://guardroom:9999/api/graph
      INVESTIGATOR_SOURCE_ID: guardroom
      INVESTIGATOR_DB: /app/investigator/.data/investigator.sqlite3
      INVESTIGATOR_POLL_SECONDS: "5"
    volumes:
      - investigator-state:/app/investigator/.data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9998/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  guardroom-state:
  investigator-state:
