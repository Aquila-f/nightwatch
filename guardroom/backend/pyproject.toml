requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "nightwatch-agent",
    "uvicorn>=0.30,<1",
]

[tool.uv.sources]
nightwatch-agent = { path = "../../investigator" }

[dependency-groups]
dev = ["httpx>=0.27,<1"]
