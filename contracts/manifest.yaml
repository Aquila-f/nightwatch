schema_version: nightwatch.manifest.v2
nodes:
  - {id: load-generator, kind: synthetic, layout: {row: -1, col: 3}}
  - {id: frontend-proxy, kind: service, layout: {row: 0, col: 3}, health_url: http://demo-adapter:8080/frontend-proxy/healthz}
  - {id: frontend,        kind: service, layout: {row: 1, col: 3}, health_url: http://demo-adapter:8080/frontend/healthz}
  - {id: product-catalog, kind: service, layout: {row: 2, col: 0}, health_url: http://demo-adapter:8080/product-catalog/healthz}
  - {id: cart,            kind: service, layout: {row: 2, col: 1}, health_url: http://demo-adapter:8080/cart/healthz}
  - {id: checkout,        kind: service, layout: {row: 2, col: 2}, health_url: http://demo-adapter:8080/checkout/healthz}
  - {id: recommendation,  kind: service, layout: {row: 2, col: 3}, health_url: http://demo-adapter:8080/recommendation/healthz}
  - {id: ad,              kind: service, layout: {row: 2, col: 4}, health_url: http://demo-adapter:8080/ad/healthz}
  - {id: currency,        kind: service, layout: {row: 2, col: 5}, health_url: http://demo-adapter:8080/currency/healthz}
  - {id: image-provider,  kind: service, layout: {row: 2, col: 6}, health_url: http://demo-adapter:8080/image-provider/healthz}
  - {id: payment,         kind: service, layout: {row: 3, col: 1}, health_url: http://demo-adapter:8080/payment/healthz}
  - {id: shipping,        kind: service, layout: {row: 3, col: 2}, health_url: http://demo-adapter:8080/shipping/healthz}
  - {id: email,           kind: service, layout: {row: 3, col: 3}, health_url: http://demo-adapter:8080/email/healthz}
  - {id: quote,           kind: service, layout: {row: 3, col: 4}, health_url: http://demo-adapter:8080/quote/healthz}
  - {id: fraud-detection, kind: service, layout: {row: 3, col: 5}, health_url: http://demo-adapter:8080/fraud-detection/healthz}
  - {id: accounting,      kind: service, layout: {row: 3, col: 6}, health_url: http://demo-adapter:8080/accounting/healthz}
  - {id: astronomy-db, kind: datastore, layout: {row: 4, col: 0}, selector: {server_address: astronomy-db}}
  - {id: valkey-cart,  kind: datastore, layout: {row: 4, col: 1}, selector: {server_address: valkey-cart}}
  - {id: kafka, kind: queue, layout: {row: 4, col: 5}, sat: queue, owner: fraud-detection, selector: {messaging_system: kafka}}
edges:
  - {from: load-generator, to: frontend-proxy, kind: calls}
  - {from: frontend-proxy, to: frontend, kind: calls}
  - {from: frontend-proxy, to: image-provider, kind: calls}
  - {from: frontend, to: ad, kind: calls}
  - {from: frontend, to: cart, kind: calls}
  - {from: frontend, to: checkout, kind: calls}
  - {from: frontend, to: currency, kind: calls}
  - {from: frontend, to: product-catalog, kind: calls}
  - {from: frontend, to: recommendation, kind: calls}
  - {from: frontend, to: shipping, kind: calls}
  - {from: checkout, to: cart, kind: calls}
  - {from: checkout, to: product-catalog, kind: calls}
  - {from: checkout, to: currency, kind: calls}
  - {from: checkout, to: payment, kind: calls}
  - {from: checkout, to: shipping, kind: calls}
  - {from: checkout, to: email, kind: calls}
  - {from: checkout, to: kafka, kind: publishes}
  - {from: shipping, to: quote, kind: calls}
  - {from: recommendation, to: product-catalog, kind: calls}
  - {from: cart, to: valkey-cart, kind: uses}
  - {from: product-catalog, to: astronomy-db, kind: uses}
  - {from: accounting, to: astronomy-db, kind: uses}
  - {from: accounting, to: kafka, kind: consumes}
  - {from: fraud-detection, to: kafka, kind: consumes}
checks:
  - {id: products_probe, url: http://frontend-proxy:8080/api/products, meaning_zh: 商品列表 API 可用}
  - {id: home_probe, url: http://frontend-proxy:8080/, meaning_zh: 前端首頁可用}
  - {id: recommendations_probe, url: "http://frontend-proxy:8080/api/recommendations?productIds=0PUK6V6EV0&sessionId=nightwatch-probe&currencyCode=USD", meaning_zh: 推薦 API 可用}
  - {id: currency_probe, url: http://frontend-proxy:8080/api/currency, meaning_zh: 幣別 API 可用}
mechanism_families:
  payment_auth_failure: [payment, provider, upstream, "502", "invalid token", "auth", 付款, 供應商, 上游, 授權, token]
  recommendation_cache_growth: [recommendation, cache, "cache miss", heap, memory, allocation, 推薦, 快取, 記憶體, 堆積]
  kafka_consumer_backlog: [kafka, "consumer lag", lag, backlog, producer, consumer, queue, 消費者, 佇列, 積壓]
  cart_controlled_failure: [cart, redis, valkey, "empty cart", 購物車, 清空]
  email_memory_growth: [email, "memory leak", heap, gc, allocation, 郵件, 記憶體, 洩漏]
actions:
  - {id: restore_payment_config, targets: [payment], families: [payment_auth_failure], steps: [{kind: put_config, revision: v1}], description_zh: "把 payment 的付款設定回滾到 v1"}
  - {id: restore_recommendation_config, targets: [recommendation], families: [recommendation_cache_growth], steps: [{kind: put_config, revision: v1}], description_zh: "停掉 recommendation 的快取異常路徑,回滾到 v1"}
  - {id: restore_kafka_config, targets: [checkout], families: [kafka_consumer_backlog], steps: [{kind: put_config, revision: v1}], description_zh: "把 checkout 的訂單發佈設定回滾到 v1,讓 consumer 消化積壓"}
  - {id: restore_cart_config, targets: [cart], families: [cart_controlled_failure], steps: [{kind: put_config, revision: v1}], description_zh: "把 cart 的錯誤比例回滾到 v1"}
  - {id: restore_email_config, targets: [email], families: [email_memory_growth], steps: [{kind: put_config, revision: v1}], description_zh: "把 email 的設定回滾到 v1"}
runtime_targets:
  payment:        {description_zh: "付款服務;可調整付款請求失敗比例", known_good_revision: v1, known_good_knobs: {paymentFailure: 0}, knobs: {paymentFailure: {type: number, min: 0, max: 1, description_zh: "付款請求失敗機率;正常值為 0"}}, maintenance: {}}
  cart:           {description_zh: "購物車服務;可調整清空購物車的失敗比例", known_good_revision: v1, known_good_knobs: {cartFailure: 0}, knobs: {cartFailure: {type: number, min: 0, max: 1, description_zh: "清空購物車請求走錯誤路徑的比例;正常值為 0"}}, maintenance: {}}
  recommendation: {description_zh: "推薦服務;可開關快取異常路徑", known_good_revision: v1, known_good_knobs: {recommendationCacheFailure: false}, knobs: {recommendationCacheFailure: {type: boolean, description_zh: "是否啟用快取異常路徑;正常值為 false"}}, maintenance: {}}
  checkout:       {description_zh: "結帳服務;可調整每筆訂單額外發佈到 Kafka 的訊息數", known_good_revision: v1, known_good_knobs: {kafkaQueueProblems: 0}, knobs: {kafkaQueueProblems: {type: number, min: 0, max: 100, description_zh: "每筆訂單額外發佈的訊息數(整數);正常值為 0"}}, maintenance: {}}
  email:          {description_zh: "郵件服務;可調整確認信本文放大倍數", known_good_revision: v1, known_good_knobs: {emailMemoryLeak: 0}, knobs: {emailMemoryLeak: {type: number, min: 0, max: 10000, description_zh: "確認信本文放大與保留倍數;正常值為 0"}}, maintenance: {}}
