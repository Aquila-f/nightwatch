schema_version: nightwatch.cards.v2
cards:
  - id: payment_failure_ramp
    title_zh: 付款失敗率逐步攀升
    symptom_zh: 結帳失敗率逐步升高;付款先出錯,之後 checkout 與前端跟著出錯
    story_zh: 付款供應商的授權問題逐漸擴大,部分扣款收到無效 token
    difficulty: medium
    on_stage: primary
    lease_secs: 1200
    revision: v2
    knobs: [{service: payment, knob: paymentFailure, curve: {type: exp, from: 0, to: 0.6, duration_secs: 150}}]
    expect: {detect_after_secs: [60, 120], expected_outcome: recovered}
    truth: {root: payment, mechanism_family: payment_auth_failure, expected_action: "restore_payment_config:payment", expected_order: [payment, checkout, frontend], decoys: []}
    verify: {settle_max_secs: 40, predicates: []}
  - id: recommendation_cache_growth
    title_zh: 推薦快取異常膨脹
    symptom_zh: 商品頁與推薦區逐步變慢,推薦服務處理時間與記憶體上升
    story_zh: 推薦服務的快取失效後反覆追加商品 id,集合持續膨脹
    difficulty: hard
    on_stage: secondary
    lease_secs: 1200
    revision: v2
    knobs: [{service: recommendation, knob: recommendationCacheFailure, curve: {type: const, value: true}}]
    expect: {detect_after_secs: [90, 240], expected_outcome: recovered}
    truth: {root: recommendation, mechanism_family: recommendation_cache_growth, expected_action: "restore_recommendation_config:recommendation", expected_order: [recommendation, frontend], decoys: []}
    verify: {settle_max_secs: 90, predicates: []}
  - id: kafka_consumer_backlog
    title_zh: 訂單後處理積壓
    symptom_zh: 前台結帳正常,但訂單後處理與風控延遲上升,佇列積壓持續增加
    story_zh: 結帳服務開始重複發佈訂單訊息,風控 consumer 每筆處理都多等一秒
    difficulty: hard
    on_stage: backup
    lease_secs: 1200
    revision: v2
    knobs: [{service: checkout, knob: kafkaQueueProblems, curve: {type: step, levels: [0, 10, 25, 50, 100], hold_secs: 30}}]
    expect: {detect_after_secs: [90, 240], expected_outcome: recovered}
    truth: {root: kafka, mechanism_family: kafka_consumer_backlog, expected_action: "restore_kafka_config:checkout", expected_order: [kafka, fraud-detection], decoys: []}
    verify: {settle_max_secs: 120, predicates: [{kind: node_extra_monotonic_down, node: kafka, extra: consumer_lag, max: 50}]}
  - id: payment_failure_with_cart_decoy
    title_zh: 付款劣化與購物車假線索
    symptom_zh: 結帳失敗率逐步升高,同時偶爾看到購物車清空錯誤
    story_zh: 付款授權問題逐步惡化,並混入 3% 的購物車清空失敗
    difficulty: hard
    on_stage: off
    lease_secs: 1200
    revision: v2
    knobs:
      - {service: payment, knob: paymentFailure, curve: {type: exp, from: 0, to: 0.45, duration_secs: 120}}
      - {service: cart, knob: cartFailure, curve: {type: const, value: 0.03}}
    expect: {detect_after_secs: [60, 120], expected_outcome: recovered}
    truth: {root: payment, mechanism_family: payment_auth_failure, expected_action: "restore_payment_config:payment", expected_order: [payment, checkout, frontend], decoys: [cart]}
    verify: {settle_max_secs: 40, predicates: []}
  - id: email_memory_growth
    title_zh: 訂單確認信記憶體成長
    symptom_zh: 結帳最後一步逐漸變慢,checkout 與前端延遲上升
    story_zh: 郵件服務保留過大的信件本文,記憶體與 GC 壓力持續增加
    difficulty: hard
    on_stage: off
    lease_secs: 1200
    revision: v2
    knobs: [{service: email, knob: emailMemoryLeak, curve: {type: step, levels: [0, 10, 100, 1000], hold_secs: 45}}]
    expect: {detect_after_secs: [120, 240], expected_outcome: recovered}
    truth: {root: email, mechanism_family: email_memory_growth, expected_action: "restore_email_config:email", expected_order: [email, checkout, frontend], decoys: []}
    verify: {settle_max_secs: 90, predicates: []}
