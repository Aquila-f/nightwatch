listen: ":8080"
flags_file: /data/demo.flagd.json
targets:
  frontend-proxy:  {health: {kind: http, addr: http://frontend-proxy:8080/}}
  frontend:        {health: {kind: tcp, addr: frontend:8080}}
  image-provider:  {health: {kind: http, addr: http://image-provider:8081/status}}
  product-catalog: {health: {kind: tcp, addr: product-catalog:3550}}
  cart:            {health: {kind: tcp, addr: cart:7070}, knobs: {cartFailure: {type: number, pristine: 0}}}
  checkout:        {health: {kind: tcp, addr: checkout:5050}, knobs: {kafkaQueueProblems: {type: number, pristine: 0}}}
  payment:         {health: {kind: tcp, addr: payment:50051}, knobs: {paymentFailure: {type: number, pristine: 0}}}
  currency:        {health: {kind: tcp, addr: currency:7001}}
  shipping:        {health: {kind: tcp, addr: shipping:50050}}
  quote:           {health: {kind: tcp, addr: quote:8090}}
  email:           {health: {kind: tcp, addr: email:6060}, knobs: {emailMemoryLeak: {type: number, pristine: 0}}}
  recommendation:  {health: {kind: tcp, addr: recommendation:9001}, knobs: {recommendationCacheFailure: {type: boolean, pristine: false}}}
  ad:              {health: {kind: tcp, addr: ad:9555}}
  accounting:      {health: {kind: none}}
  fraud-detection: {health: {kind: none}}
