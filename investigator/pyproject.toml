[project]
name = "nightwatch-investigator"
version = "0.2.0"
description = "Independent graph observation and detection service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightwatch_investigator"]
