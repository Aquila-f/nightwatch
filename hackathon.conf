# 這一場的設定。改完跑 leader.sh。
#
# 新流程:leader.sh 先在 WORKDIR 裡把內容備齊,才去建 repo、指 upstream。
# 所以「準備資料夾」不會碰到 GitHub —— 只有真的跑 leader.sh 才會建 repo。

# ⚠️ 兩個不分大小寫的坑,leader.sh 都會擋下來,但名字還是要另外取:
#    GitHub 的 repo 名字不分大小寫 —— "Nightwatch" 會指到既有的 davidleitw/NightWatch。
#    macOS 的檔案系統也不分 —— ~/Desktop/nightwatch 會指到既有的 ~/Desktop/NightWatch。
REPO="davidleitw/nightwatch-hack"           # H0 用(確認過沒被佔)
# REPO="davidleitw/test-repo"               # 演練用

VISIBILITY="public"                         # public 才開得了主線保護(免費方案)
MAIN="master"                               # 主線名字。leader.sh 拿它 git init -b,
                                            # gate.sh 的 GATE_BASE 預設也是 master
WORKDIR="$HOME/Desktop/${REPO##*/}"         # 要備好的資料夾,跟著 REPO 走。
                                            # repo 還不存在時就先在這裡把東西放好

PARTS="shop control console"                # 每個部份一個目錄一個主人
                                            # ⚠️ 跑 leader.sh 前要定對,之後不好改

TEAM="wwwXOX Aquila-f ms0701515"            # 只寫帳號 = 部份還沒分,先把邀請發出去
                                            # 分好之後改成 <部份>:<帳號>,例如
                                            # TEAM="shop:wwwXOX control:Aquila-f console:ms0701515"

CHECK_CMD=""                                # 驗收指令,留空 = 不驗。會被叫成 <CHECK_CMD> <部份>,
                                            # 工作目錄是 repo 根。留空的話 setup.sh 不驗、
                                            # task.sh submit 不驗、gate.sh 只驗格式/目錄/
                                            # 合併/契約疑問 —— 不假設每台機器的環境一樣。

TOOLS="git gh codex"                        # 每個人都要的。只列真的每台都得有的,
                                            # 語言工具鏈交給各人自己準備。
                                            # 可加 名字>=版本(go/bun/node/git/gh/codex)
# TOOLS_shop="go>=1.26"                     # (選用)某個部份額外要的

# 要原樣搬進 WORKDIR 的東西,一項寫成 <來源>:<repo 裡的位置>,空白隔開。
# 來源不存在會報紅;同名的會被覆蓋(種子是正本)。路徑裡不要有空白或冒號。
NW="$HOME/Desktop/NightWatch"
SEED="\
$NW/hackathon/.gitignore:.gitignore \
$NW/hackathon/README-repo.md:README.md \
$NW/hackathon/task.sh:task.sh \
$NW/hackathon/run-task.sh:run-task.sh \
$NW/hackathon/TASK-TEMPLATE.md:TASK-TEMPLATE.md \
$NW/hackathon/stubs:stubs \
$NW/hackathon/contracts:contracts \
$NW/hackathon/shop/BRIEF.md:shop/BRIEF.md \
$NW/hackathon/shop/tasks:shop/tasks \
$NW/hackathon/control/BRIEF.md:control/BRIEF.md \
$NW/hackathon/control/tasks:control/tasks \
$NW/hackathon/console/BRIEF.md:console/BRIEF.md \
$NW/hackathon/console/tasks:console/tasks \
$NW/hackathon/gate:gate \
$NW/hackathon/.agents/skills/task-loop:.agents/skills/task-loop \
$HOME/.claude/plugins/cache/i-am-the-duck/i-am-the-duck/0.0.4/skills/duck:.agents/skills/duck \
$NW/.claude/skills/merge-loop:.claude/skills/merge-loop"

# gate.sh 要知道部份目錄在 repo 的哪一層。新 repo 的 shop/ control/ console/
# 就在根目錄,所以是空字串(gate.sh 那邊用的是 ${GATE_PARTS_ROOT-...},空字串有效)。
export GATE_PARTS_ROOT=""
